name: Generate Metrics

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: itzlucifa
          template: classic
          config_timezone: Asia/Kolkata
          base: ""
          config_order: foo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          plugin_languages_ignored: html,css
          plugin_lines: yes
          plugin_lines_history: 1
          plugin_lines_sections: base
          plugin_stargazers: yes
          plugin_stargazers_limit: 10
          plugin_stargazers_sort: stars
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_types: commit,issue,pr
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_followup: yes
          plugin_followup_sections: repositories,organizations
          plugin_followup_limit: 10
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_chart_type: classic
          plugin_skills: yes
          plugin_skills_columns: 4
          plugin_skills_details: yes
          plugin_skills_threshold: 0.5
          output_action: dist/metrics.svg
      
      - name: Push metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f dist/
          git commit -m "📊 Update metrics" || echo "No changes to commit"
          git push