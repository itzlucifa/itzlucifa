name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate 3D contribution graph
        uses: yihong0648/github-contrib-3d-action@v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: itzlucifa
          year: 2026
          output_path: dist/3d-contrib.svg
      
      - name: Push 3D contribution graph
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f dist/
          git commit -m "🌈 Update 3D contribution graph" || echo "No changes to commit"
          git push